name: Build and Test

env:
  PKGDIR: "packages/basemap"
  CIBW_BUILD_VERBOSITY: 1
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: "ignore:DEPRECATION"
  GEO_VERSION: "3.6.5"

on:
  push:
    paths:
      - ".github/workflows/**"
      - "packages/basemap/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "packages/basemap/**"
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: "3.16.x"

      - name: Setup C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup Visual Studio Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup C++ toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select --install || true

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.16.2

      - name: Set GEO src directory
        shell: bash
        run: |
          echo "GEO_DIR=${GITHUB_WORKSPACE}/geo" >> $GITHUB_ENV

      - name: Build wheels
        env:
          CIBW_BUILD: cp{39,310,311,312}-{manylinux_x86_64,win_amd64,macosx_x86_64,macosx_arm64}
          CIBW_SKIP: "*-manylinux_i686 *-musllinux* pp*"

          CIBW_BEFORE_BUILD: >
            python -c "import utils; utils.GeosLibrary('${{ env.GEO_VERSION }}').build('${{ env.GEO_DIR}}', njobs=16)"

          CIBW_ENVIRONMENT_WINDOWS: |
            GEOS_DIR=${{ env.GEO_DIR }}
            INCLUDE=${{ env.GEO_DIR }}/include;%%INCLUDE%%
            LIB=${{ env.GEO_DIR }}/lib;%%LIB%%
            PATH=${{ env.GEO_DIR }}/bin;%%PATH%%
            CMAKE_GENERATOR="Visual Studio 17 2022"
            CMAKE_GENERATOR_PLATFORM="x64"
            CFLAGS="/I${{ env.GEO_DIR }}/include"
            LDFLAGS="/LIBPATH:${{ env.GEO_DIR }}/lib"

          CIBW_ENVIRONMENT_LINUX: |
            GEOS_DIR=${{ env.GEO_DIR }}
            CFLAGS="-I${{ env.GEO_DIR }}/include"
            LDFLAGS="-L${{ env.GEO_DIR }}/lib"
            LD_LIBRARY_PATH="${{ env.GEO_DIR }}/lib:$LD_LIBRARY_PATH"

          CIBW_ENVIRONMENT_MACOS: |
            GEOS_DIR=${{ env.GEO_DIR }}
            CFLAGS=-I${{ env.GEO_DIR }}/include
            LDFLAGS=-L${{ env.GEO_DIR }}/lib
            DYLD_LIBRARY_PATH=${{ env.GEO_DIR }}/lib:$DYLD_LIBRARY_PATH
            CMAKE_GENERATOR="Unix Makefiles"
            CFLAGS="/I${{ env.GEO_DIR }}/include"
            LDFLAGS="/LIBPATH:${{ env.GEO_DIR }}/lib"

          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            dir "%GEOS_DIR%\bin" &&
            mkdir "{project}\mpl_toolkits\basemap" 2>NUL &&
            copy "%GEOS_DIR%\bin\geos*.dll" "{project}\mpl_toolkits\basemap\" &&
            for /f "tokens=*" %%a in ('dir /b /s "C:\Users\runneradmin\AppData\Local\Temp\cibw-run-*\cp*\build"') do copy "%GEOS_DIR%\bin\geos*.dll" "%%a" &&
            for /f "tokens=*" %%a in ('dir /b /s "C:\Users\runneradmin\AppData\Local\Temp\cibw-run-*\cp*\built_wheel"') do copy "%GEOS_DIR%\bin\geos*.dll" "%%a" &&
            set PATH=%GEOS_DIR%\bin;%PATH% &&
            delvewheel repair --no-dll-reference -w {dest_dir} {wheel}

          CIBW_TEST_COMMAND_WINDOWS: >-
            pip install pytest pytest-cov &&
            pip install {wheel} &&
            python -c "import os; print('DLL location check:'); print(os.listdir(os.path.dirname(__import__('mpl_toolkits.basemap').__file__)))" &&
            python -c "from mpl_toolkits import basemap; print('Import successful')" &&
            python -m pytest "{project}/test" --cov="mpl_toolkits.basemap" --cov-report=term --ignore=dist --ignore=build

          CIBW_TEST_COMMAND: >-
            pip install {wheel} &&
            python -c "import mpl_toolkits.basemap" &&
            cd {project} &&
            pip install pytest pytest-cov &&
            python -m pytest --cov="mpl_toolkits.basemap" --cov-report=term --ignore=dist --ignore=build

        run: |
          cd ${{ env.PKGDIR }}
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ${{ env.PKGDIR }}/wheelhouse/*.whl
